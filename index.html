<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>HHP Hand Sim</title>
  <meta name="description" content="Live NLHE hand simulator with HHP preflop charts.">
  <meta name="theme-color" content="#0a1a33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HHP Sim">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="pill" id="drillBtn" aria-label="Choose drill"><span id="drillName">Random</span> ▾</button>
      <div class="stakes" id="stakes">—</div>
      <nav class="top-actions">
        <button class="icon-btn" id="historyBtn" aria-label="History">
          <svg viewBox="0 0 24 24"><path d="M12 7v5l3 2M3.5 12a8.5 8.5 0 1 0 2.5-6M3 4v4h4" /></svg>
        </button>
        <button class="icon-btn" id="statsBtn" aria-label="Stats">
          <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6" /></svg>
        </button>
        <button class="icon-btn" id="menuBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        </button>
      </nav>
    </header>

    <div class="strip">
      <button class="strip-btn" id="readsBtn">Reads</button>
      <div class="potbig" id="pot" aria-live="polite"><span class="lbl">Pot</span><b>$0</b></div>
      <button class="strip-btn" id="logBtn">Log</button>
    </div>

    <main class="main">
      <section class="table-wrap">
        <div class="felt" id="felt">
          <div class="board-area">
            <div class="board" id="board"></div>
          </div>
        </div>
        <div id="seats"></div>
        <div class="hero-hand" id="heroHand"></div>
      </section>
    </main>

    <footer class="actionbar" id="actionbar"></footer>
  </div>

  <div class="scrim hidden" id="scrim"></div>
  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div class="toast hidden" id="toast" role="status"></div>
  <input type="file" id="importFile" accept=".csv,text/csv" hidden>

  <script src="js/vendor/pokersolver.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
