<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>HHP Hand Sim</title>
  <meta name="description" content="Live NLHE hand simulator with HHP preflop charts.">
  <meta name="theme-color" content="#0a1a33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HHP Sim">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="infotag" id="infotag" aria-live="polite"><b id="stakes">—</b><span id="drillName">Random</span></div>

    <main class="main">
      <section class="table-wrap" id="tableWrap">
        <div class="felt" id="felt">
          <div class="board-area">
            <div class="potbig" id="pot" aria-live="polite"><span class="lbl">Pot</span><b>$0</b></div>
            <div class="board" id="board"></div>
          </div>
        </div>
        <div id="seats"></div>
        <div class="hero-hand" id="heroHand"></div>
      </section>
    </main>

    <footer class="actionbar" id="actionbar"></footer>
  </div>

  <button class="hamburger" id="menuToggle" aria-label="Menu" aria-expanded="false" aria-controls="drawer">
    <span></span><span></span><span></span>
  </button>
  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="drawer" id="drawer" aria-label="Menu" aria-hidden="true">
    <div class="drawer-head">
      <b>Menu</b>
      <button class="drawer-close" id="drawerClose" aria-label="Close menu">✕</button>
    </div>
    <nav class="drawer-tabs" id="drawerTabs" role="tablist">
      <button role="tab" data-tab="reads">Reads</button>
      <button role="tab" data-tab="log">Log</button>
      <button role="tab" data-tab="drill">Drill</button>
      <button role="tab" data-tab="history">History</button>
      <button role="tab" data-tab="stats">Stats</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="scrim hidden" id="scrim"></div>
  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div class="toast hidden" id="toast" role="status"></div>
  <input type="file" id="importFile" accept=".csv,text/csv" hidden>

  <script src="js/vendor/pokersolver.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
